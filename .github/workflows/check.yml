# 每次推送和拉取请求都跑一遍检查（决策 0019 第 7 条）：
# 类型检查、代码检查、单元测试、格式，然后构建，最后用真浏览器跑界面冒烟测试。
# 不部署、不调用百炼，用不到任何密钥。
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 类型检查、代码检查、单元测试、格式
        run: npm run check

      # 构建前要下载约 50 MB 的模型和边界数据（scripts/prepare_assets.mjs），缓存起来，脚本不变就不再下载
      - name: 缓存下载的模型和边界数据
        uses: actions/cache@v4
        with:
          path: .cache/assets
          key: assets-${{ hashFiles('scripts/prepare_assets.mjs') }}

      - name: 构建
        run: npm run build

      - name: 缓存 Playwright 的浏览器
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: 安装 Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 安装 Chromium 的系统依赖
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 界面冒烟测试
        run: npm run test:e2e

      - name: 失败时上传测试记录
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
